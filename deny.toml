[graph]
targets = []
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Older duplicate versions kept only because they come from
# semver-incompatible transitive deps that cannot be unified:
#   - rand 0.9.x / rand_core 0.9.x / getrandom 0.3.x: pulled in by nanoid 0.5.0
#   - r-efi 5.x and syn 2.x: only present in the target-independent graph
skip = [
    { name = "getrandom", version = "0.3.4" },
    { name = "r-efi", version = "5.3.0" },
    { name = "rand", version = "0.9.5" },
    { name = "rand_core", version = "0.9.5" },
    { name = "syn", version = "2.0.119" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
