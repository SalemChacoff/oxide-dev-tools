[workspace]
members = [
    "crates/oxide-dev-tools-core",
    "crates/oxide-dev-tools-cli",
    "crates/oxide-dev-tools-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/SalemChacoff/oxide-dev-tools"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
uuid = { version = "1.23.1", features = [
    "v1",
    "v3",
    "v4",
    "v5",
    "v6",
    "v7",
    "v8",
    "md5",
    "sha1",
] }
ulid = "3.0.0"
nanoid = "0.5.0"
rand = "0.10"
semver = "1.0.28"
chrono = "0.4"
chrono-tz = "0.10"
base64 = "0.23.1"
hex = "0.4.3"
hmac = "0.12.1"
quick-xml = "0.41.0"
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
url = "2.5.8"
zxcvbn = "3.1.1"
# Pinned per the 7-day supply-chain rule (security-audit skill):
# 0.7.0 becomes eligible 2026-10-05; 0.6.5 is yanked. Re-audit before upgrading.
gpui-kit = "0.6.6"

[profile.release]
lto = "thin"
strip = true
