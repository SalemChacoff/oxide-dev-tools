[workspace]
members = [
    "crates/oxide-dev-tools-core",
    "crates/oxide-dev-tools-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/SalemChacoff/oxide-dev-tools"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
uuid = { version = "1.23.1", features = [
    "v1",
    "v3",
    "v4",
    "v5",
    "v6",
    "v7",
    "v8",
    "md5",
    "sha1",
] }
ulid = "1.2.1"
nanoid = "0.5.0"
rand = "0.9"
chrono = "0.4"
base64 = "0.23.1"

[profile.release]
lto = "thin"
strip = true
