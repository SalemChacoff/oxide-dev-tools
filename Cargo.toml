[workspace]
members = [
    "crates/oxide-dev-tools-core",
    "crates/oxide-dev-tools-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/SalemChacoff/oxide-dev-tools"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
uuid = { version = "1.23.1", features = [
    "v1",
    "v3",
    "v4",
    "v5",
    "v6",
    "v7",
    "v8",
    "md5",
    "sha1",
] }
ulid = "3.0.0"
nanoid = "0.5.0"
rand = "0.10"
chrono = "0.4"
chrono-tz = "0.10"
base64 = "0.23.1"
hex = "0.4.3"
hmac = "0.12.1"
quick-xml = "0.41.0"
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"

[profile.release]
lto = "thin"
strip = true
